<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURUM — Pick History</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #080808;
    --gold: #C9A84C;
    --white: #F0EDE6;
    --muted: #6B6560;
    --danger: #8B3A3A;
    --positive: #3A6B4A;
    --rule: rgba(201,168,76,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 18px;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 2.5rem;
    border-bottom: 1px solid var(--rule);
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--gold);
  }

  .logo span {
    color: var(--white);
    opacity: 0.3;
    font-weight: 300;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    display: block;
    margin-top: -4px;
  }

  nav a {
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
    margin-left: 1.5rem;
  }

  nav a:hover { color: var(--gold); }
  nav a.active { color: var(--gold); }

  main {
    padding: 3rem 2.5rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .page-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 300;
    color: var(--white);
    margin-bottom: 0.5rem;
  }

  .page-title em { color: var(--gold); font-style: normal; }

  .page-sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 3rem;
    line-height: 1.7;
  }

  .gold-rule {
    width: 100%;
    height: 1px;
    background: var(--rule);
    margin: 2.5rem 0;
  }

  .section-label {
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 1.5rem;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.4rem 1rem;
    cursor: pointer;
    transition: all 0.3s;
  }

  .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
  .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.05); }

  /* History list */
  .history-list {
    display: grid;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
  }

  .history-card {
    background: var(--black);
    padding: 1.5rem;
    transition: background 0.3s;
  }

  .history-card:hover { background: rgba(201,168,76,0.03); }

  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.8rem;
  }

  .history-left { display: flex; align-items: center; gap: 1rem; }

  .history-score {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
    min-width: 55px;
  }

  .history-score.mid { color: var(--muted); }

  .history-ticker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    color: var(--white);
    margin-bottom: 0.2rem;
  }

  .history-date {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .history-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.4rem;
  }

  .history-type {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border: 1px solid var(--rule);
    color: var(--muted);
  }

  .history-type.real {
    border-color: rgba(201,168,76,0.3);
    color: var(--gold);
  }

  .history-type.simulated {
    border-color: rgba(107,101,96,0.4);
    color: var(--muted);
  }

  .history-return {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
  }

  .history-return.positive { color: var(--positive); }
  .history-return.negative { color: var(--danger); }
  .history-return.pending { color: var(--muted); }

  .history-brief {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 0.5rem;
    padding-top: 0.8rem;
    border-top: 1px solid var(--rule);
  }

  .history-signals {
    display: flex;
    gap: 1rem;
    margin-top: 0.8rem;
    flex-wrap: wrap;
  }

  .signal-chip {
    font-size: 0.65rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .signal-chip span {
    color: var(--gold);
    margin-left: 0.3rem;
  }

  .empty-state {
    padding: 3rem;
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    border: 1px solid var(--rule);
    margin-bottom: 2.5rem;
  }

  .stat-cell {
    background: var(--black);
    padding: 1.2rem 1.5rem;
  }

  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .stat-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--gold);
    line-height: 1;
  }

  footer {
    padding: 2rem 2.5rem;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4rem;
  }

  footer p {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .footer-au {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--rule);
    letter-spacing: 0.3em;
  }

  @media (max-width: 600px) {
    main { padding: 2rem 1.5rem; }
    header { padding: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .stats-bar { grid-template-columns: 1fr 1fr; }
    .history-signals { gap: 0.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    AU
    <span>PRIVATE INTELLIGENCE</span>
  </div>
  <nav>
    <a href="index.html">Brief</a>
    <a href="history.html" class="active">History</a>
    <a href="simulator.html">Simulator</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main>

  <div class="page-title">Pick <em>Archive.</em></div>
  <div class="page-sub">Every pick AURUM has ever generated — scored, briefed, and tracked against outcome.</div>

  <div class="section-label">All Time Stats</div>
  <div class="stats-bar">
    <div class="stat-cell">
      <div class="stat-label">Total Picks</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-cell">
      <div class="stat-label">Avg Score</div>
      <div class="stat-value" id="stat-avg">—</div>
    </div>
    <div class="stat-cell">
      <div class="stat-label">Top Pick</div>
      <div class="stat-value" id="stat-top">—</div>
    </div>
  </div>

  <div class="gold-rule"></div>

  <div class="section-label">Pick History</div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterPicks('all', this)">All</button>
    <button class="filter-btn" onclick="filterPicks('real', this)">Real</button>
    <button class="filter-btn" onclick="filterPicks('simulated', this)">Simulated</button>
    <button class="filter-btn" onclick="filterPicks('high', this)">Score 80+</button>
  </div>

  <div class="history-list" id="history-container">
    <div class="empty-state">No picks in archive yet. Analysis pending.</div>
  </div>

</main>

<footer>
  <p>AURUM © 2026 — Private Use Only</p>
  <div class="footer-au">AU</div>
</footer>

<script>
  const SUPABASE_URL = 'https://zpcbbwynvvyldavxzjng.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_K80lcfk8LsQNqo5enznRRA_lrzf2U9K';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let allPicks = [];

  async function loadHistory() {
    const { data } = await db.from('picks').select('*').order('picked_at', { ascending: false });
    if (!data) return;
    allPicks = data;
    renderPicks(data);
    updateStats(data);
  }

  function updateStats(data) {
    document.getElementById('stat-total').textContent = data.length || '—';
    if (data.length) {
      const avg = data.reduce((s, p) => s + p.score, 0) / data.length;
      document.getElementById('stat-avg').textContent = Math.round(avg);
      const top = data.reduce((a, b) => a.score > b.score ? a : b);
      document.getElementById('stat-top').textContent = top.ticker;
    }
  }

  function renderPicks(data) {
    const container = document.getElementById('history-container');
    if (!data || !data.length) {
      container.innerHTML = '<div class="empty-state">No picks in archive yet. Analysis pending.</div>';
      return;
    }
    container.innerHTML = data.map(p => {
      const signals = p.signals || {};
      const isReal = signals.source !== 'mock' && signals.source !== 'simulated';
      const date = new Date(p.picked_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      return `
        <div class="history-card">
          <div class="history-top">
            <div class="history-left">
              <div class="history-score ${p.score >= 75 ? 'high' : 'mid'}">${p.score}</div>
              <div>
                <div class="history-ticker">${p.ticker}</div>
                <div class="history-date">${date}</div>
              </div>
            </div>
            <div class="history-right">
              <div class="history-type ${isReal ? 'real' : 'simulated'}">${isReal ? 'Real' : 'Simulated'}</div>
              <div class="history-return pending">Monitoring</div>
            </div>
          </div>
          <div class="history-brief">${p.brief || '—'}</div>
          ${signals.momentum || signals.sentiment ? `
          <div class="history-signals">
            ${signals.momentum ? `<div class="signal-chip">Momentum<span>${signals.momentum}</span></div>` : ''}
            ${signals.sentiment ? `<div class="signal-chip">Sentiment<span>${signals.sentiment}</span></div>` : ''}
            ${signals.political ? `<div class="signal-chip">Political<span>${signals.political}</span></div>` : ''}
            ${signals.macro ? `<div class="signal-chip">Macro<span>${signals.macro}</span></div>` : ''}
          </div>` : ''}
        </div>
      `;
    }).join('');
  }

  function filterPicks(type, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    let filtered = allPicks;
    if (type === 'real') filtered = allPicks.filter(p => p.signals?.source !== 'mock' && p.signals?.source !== 'simulated');
    if (type === 'simulated') filtered = allPicks.filter(p => p.signals?.source === 'mock' || p.signals?.source === 'simulated');
    if (type === 'high') filtered = allPicks.filter(p => p.score >= 80);
    renderPicks(filtered);
  }

  loadHistory();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/aurum-app/sw.js');
  }
</script>

</body>
</html>
